name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race onto the box.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      # No third-party deploy action — plain ssh/rsync keeps the supply chain small.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy dist/ to server
        env:
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # --delete keeps the web root an exact mirror of dist/.
          # DEPLOY_PATH MUST be a dedicated directory (see docs/DEPLOY.md).
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${SSH_PORT}" \
            dist/ \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"
